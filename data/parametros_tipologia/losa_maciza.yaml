# Configuración toggleable — Tipología: Losa Maciza de Hormigón Armado
#
# Cada variable/parámetro/objetivo/restricción tiene "activo: true/false".
# - Si una VARIABLE tiene activo=false, se usa "valor_fijo" y el algoritmo no la mueve.
# - Si un OBJETIVO/RESTRICCIÓN tiene activo=false, el motor lo excluye del problema.
#
# Ver la explicación completa de cada ítem en docs/software/algoritmo-nsga2.md — este
# archivo es el que realmente lee el motor (src/engine/src/optimization/nsga2.ts);
# el .md es la documentación legible para humanos.
#
# Perfiles predefinidos abajo del todo: "basico", "avanzado", "completo".

# -----------------------------------------------------------------------------
# Filosofía normativa (a nivel de archivo, no solo en P3)
#
# El Manual de Carreteras del Paraguay usa AASHTO STANDARD (17th ed., 2002) como base
# PRINCIPAL de diseño, y solo en algunos casos AASHTO LRFD (4th ed., 2007) como
# complemento. El Manual PROHÍBE EXPLÍCITAMENTE mezclar ambas normativas en un mismo
# cálculo (hipótesis y filosofías de cálculo distintas -> riesgo de sobre/subdimensionar).
#
# El motor (src/engine/src/optimization/nsga2.ts) DEBE leer este campo y usar
# EXCLUSIVAMENTE las ecuaciones/tablas de la filosofía indicada en todo el cálculo
# estructural de la corrida. Ver docs/normativa/manual-carreteras-py.md.
# -----------------------------------------------------------------------------
filosofia_normativa: "aashto_standard_2002"  # opciones: aashto_standard_2002 | aashto_lrfd_2007

variables:
  V1_espesor_losa:
    activo: true
    tipo: continua
    unidad: m
    rango: [0.20, 1.20]
    valor_fijo: null

  V2_diametro_armadura_principal:
    activo: true
    tipo: discreta
    unidad: mm
    catalogo: [10, 12, 16, 20, 25, 32]
    valor_fijo: null

  V3_separacion_armadura_principal:
    activo: true
    tipo: continua
    unidad: m
    rango: [0.10, 0.30]
    valor_fijo: null

  V4_diametro_armadura_reparticion:
    activo: true
    tipo: discreta
    unidad: mm
    catalogo: [10, 12, 16, 20, 25, 32]
    valor_fijo: null

  V5_separacion_armadura_reparticion:
    activo: true
    tipo: continua
    unidad: m
    rango: [0.15, 0.40]
    valor_fijo: null

  V6_resistencia_hormigon:
    activo: false
    tipo: discreta
    unidad: MPa
    catalogo: [21, 25, 28, 30, 35]
    valor_fijo: 25

  V7_grado_acero:
    activo: false
    tipo: discreta_categorica
    unidad: MPa
    catalogo: [420, 500]
    valor_fijo: 420

  V8_numero_capas_armadura:
    activo: false
    tipo: discreta_categorica
    catalogo: [1, 2]
    valor_fijo: 1

  V9_recubrimiento:
    activo: false
    tipo: continua
    unidad: m
    rango: [0.025, 0.075]
    valor_fijo: null # se deriva de P7 (clase de exposición) cuando activo=false

  V10_espesor_voladizo:
    activo: false
    tipo: continua
    unidad: m
    rango: [0.15, 0.40]
    valor_fijo: null # tipología v1 no modela voladizo

parametros_sitio:
  P1_luz_diseno:
    activo: true
    unidad: m
    # valor ingresado por el usuario en cada corrida, sin default

  P2_ancho_calzada:
    activo: true
    unidad: m
    valor_referencia_manual_py: 7.30  # confirmado: minimo para transito bidireccional/2 fajas (Tabla 4.2_6). Simple via: 4.00 m minimo.

  P3_camion_diseno:
    activo: true
    valor: "aashto_standard_hs20_carga_faja" # CONFIRMADO (Manual PY 4.2.3.2 Cargas, pags. 307-316): el Manual NO define camion propio; usa cargas vivas AASHTO. 1er caso camion tipo H/HS (HS-20), 2do caso carga de faja -- se usa el que genere el efecto mas desfavorable. NO es HL-93 (eso es de AASHTO LRFD).

  P4_incremento_carga_dinamica:
    activo: true
    unidad: "%"
    valor: "I = 50/(L+125)" # CONFIRMADO (Manual PY 4.2.3.2 remite al Art. 3.8 de AASHTO STANDARD, no define formula propia): I = 50/(L+125), L en pies, maximo 30% (AASHTO STANDARD 2002, Art. 3.8.2.2).

  P5_peso_especifico_hormigon:
    activo: true
    unidad: kN/m3
    valor: 24

  P6_cargas_barandas_veredas:
    activo: false
    unidad: kN/m
    valor: 0

  P7_clase_exposicion:
    activo: true
    valor: "normal" # opciones: normal | agresiva -- define V9 cuando V9.activo=false

  P8_angulo_esviaje:
    activo: false
    unidad: grados
    valor: 0

  P9_zona_sismica:
    activo: false
    valor: null

  P10_tipo_suelo:
    activo: false
    valor: null

  P11_costo_unitario_hormigon:
    activo: true
    unidad: "USD/m3"
    valor: null # completar con precio de mercado local al momento de correr

  P12_costo_unitario_acero:
    activo: true
    unidad: "USD/kg"
    valor: null

  P13_costo_unitario_encofrado:
    activo: false
    unidad: "USD/m2"
    valor: null

  P14_factor_importancia:
    activo: false
    valor: 1.0

objetivos:
  O1_costo_total:
    activo: true
    sentido: minimizar

  O2_peso_propio:
    activo: true
    sentido: minimizar

  O3_huella_carbono:
    activo: false
    sentido: minimizar

  O4_deflexion_servicio:
    activo: false # si se activa, R9 (misma cantidad como restricción) debe desactivarse
    sentido: minimizar

  O5_complejidad_constructiva:
    activo: false
    sentido: minimizar

restricciones:
  R1_flexion_ELU:
    activo: true

  R2_cuantia_minima:
    activo: true

  R3_cuantia_maxima_ductilidad:
    activo: true

  R4_espesor_minimo_por_luz:
    activo: true

  R5_recubrimiento_minimo:
    activo: true

  R6_separacion_barras:
    activo: true

  R7_armadura_reparticion_minima:
    activo: true

  R8_control_fisuracion:
    activo: false

  R9_deflexion_servicio:
    activo: true # ver nota: mutuamente excluyente con O4_deflexion_servicio.activo

  R10_corte_ELU:
    activo: false

  R11_longitud_desarrollo:
    activo: false

# ---------------------------------------------------------------------------
# Parametros normativos (modificables -- unica fuente de verdad de valores de calculo)
#
# El motor NO hardcodea ninguno de estos numeros: lee este bloque via
# src/engine/src/config/loadYaml.ts. Si hay que ajustar un valor (por fuente nueva,
# criterio del proyecto o del tutor), se edita aca, sin tocar codigo.
#
# Confirmado = verificado contra el texto real del Manual PY
#   (docs/normativa/manual-carreteras-py.md, secciones 4.2.3.2 y 4.2.3.5)
# [VERIFICAR] = valor segun AASHTO STANDARD 2002 que aun falta contrastar contra el
#   texto de AASHTO; es editable y queda identificado para la Fase 4.
# ---------------------------------------------------------------------------
parametros_normativos:
  cargas:
    camion:
      tipo: "HS-20"                 # CONFIRMADO Manual 4.2.3.2 (camion H/HS + carga de faja, Fig. 4.2_11)
      peso_total_kN: 320.0          # AASHTO STANDARD 3.4.2 (HS20-44) [VERIFICAR texto AASHTO]
      eje_delantero_kN: 35.6
      ejes_traseros_kN: [142.3, 142.3]
      espaciamiento_ejes_m: [4.30, 4.30]   # AASHTO permite 4.30-9.00 m [VERIFICAR]
      separacion_transversal_ruedas_m: 1.80
      carga_faja_kN_m: 9.3          # AASHTO STANDARD 3.4.3 (lane load) [VERIFICAR]
    impacto:
      formula: "50/(L+125)"         # CONFIRMADO: Manual 4.2.3.2 remite al Art. 3.8 AASHTO; el Manual no redefine
      maximo_porcentaje: 30.0       # AASHTO STANDARD 2002 Art. 3.8.2.2
      L_en_pies: true               # la formula usa L en pies
    peso_especifico_hormigon_kN_m3: 24.0     # CONFIRMADO Tabla 4.2_7 (hormigon armado/pretensado)
    peso_especifico_rodadura_kN_m3: 24.0     # CONFIRMADO Tabla 4.2_7 (capa asfaltica)
    espesor_rodadura_m: 0.05                 # valor de proyecto (modificable)
    ancho_distribucion_carga_viva_m: 3.0    # ancho de via de diseno por el que se reparte el momento del camion. CLAVE [VERIFICAR AASHTO 3.24]: es la distribucion empirica de cargas en tableros de losa; este default (1 via de 3,00 m, Manual 4.2.3.2) es una aproximacion v1 a validar en Fase 4
    formula_numero_vias: "floor(ancho/3.5)"  # CONFIRMADO Manual 4.2.3.2 (ancho de camion 3,00 m; vias = ancho/3,50 m)
    factor_presencia_multiple:               # CONFIRMADO Manual 4.2.3.2 (reduccion por multiples vias)
      1: 1.00
      2: 1.00
      3: 0.90
      4: 0.75
  hormigon:
    tabla_resistencias_mpa: {PP: ">35", P: 35, A: 28, B: 21, C: 18, D: 15, E: 13}  # CONFIRMADO Tabla 4.2_17 (probeta cilindrica 28 dias)
  acero:
    grado: 60                      # CONFIRMADO Tabla 4.2_18
    fy_mpa: 420                    # CONFIRMADO Tabla 4.2_18 (punto 8.15.2.2 AASHTO)
    es_mpa: 200000                 # modulo de elasticidad del acero [VERIFICAR]
    densidad_kg_m3: 7850
  factores_lfd:
    # Combinacion Group I (LFD) de AASHTO STANDARD -- Manual PY Tabla 4.2_8 [VERIFICAR valores exactos]
    gamma: 1.3
    beta_D: 1.0
    beta_L: 1.67
  flexion:
    phi_flexion: 0.90              # AASHTO STANDARD 8.16.1.2.2
    beta1: 0.85                    # AASHTO STANDARD 8.16.2.7 (f'c <= 28 MPa)
    cuantia_minima: 0.0033         # AASHTO STANDARD 8.17.1.2 (As = 200*b*d/fy, unidades US) [VERIFICAR]
    factor_cuantia_maxima: 0.75    # AASHTO STANDARD 8.16.3.2.1 (rho_max = 0.75*rho_bal)
    deformacion_ultima_concreto: 0.003
  separacion:                      # R6 -- separacion maxima entre barras [VERIFICAR AASHTO]
    maximo_clear_m: 0.45
  espesor_minimo_losa:
    # R4 -- AASHTO STANDARD 8.9.2, formula en pulgadas con S en pulgadas [VERIFICAR contra texto AASHTO]
    formula: "1.2*(S+10)/30"
    variable_en: "pulgadas"        # la S de la formula
    resultado_en: "pulgadas"       # unidad del resultado de la formula
  recubrimientos_cm:               # CONFIRMADO Manual 4.2.3.5 (Art. 8.22 AASHTO)
    normal: {superior: 2.5, inferior: 2.5}      # losa en climas moderados
    agresiva: {superior: 4.0, inferior: 5.0}    # losa en ambientes agresivos
    contra_terreno: 7.5
    pilotes_in_situ: 7.5
  armadura_reparticion:            # R7 -- AASHTO STANDARD 3.24.10.1 [VERIFICAR]
    formula_porcentaje: "100/sqrt(S)"   # % de la armadura principal, S en pies
    maximo_porcentaje: 50.0
    S_en_pies: true
  corte:                           # R10 -- AASHTO STANDARD 8.16.6 [VERIFICAR]
    phi_corte: 0.85
    factor_vc: 2.0                 # Vc = factor_vc * sqrt(f'c) * b * d (psi, b/d en pulg)
  deflexion:                       # R9 -- AASHTO STANDARD 8.13
    ec_factor: 33.0                # Ec = ec_factor * w^1.5 * sqrt(f'c) (psi; w en lb/ft3, f'c en psi) -- 8.13.3
    peso_especifico_lb_ft3: 150.0  # para Ec (24 kN/m3 ~ 150 lb/ft3)
    limite_l: 800                  # deflexion maxima por carga viva + impacto = L/limite_l [VERIFICAR]

# ---------------------------------------------------------------------------
# Perfiles predefinidos: forma rápida de cambiar de "básico" a "completo" sin
# editar cada flag a mano. El motor, al recibir --perfil=basico, sobreescribe
# los "activo" de arriba según lo definido acá.
# ---------------------------------------------------------------------------
perfiles:
  basico:
    descripcion: "Perfil recomendado para la primera corrida (Fase 3 del ROADMAP)."
    variables_activas: [V1_espesor_losa, V2_diametro_armadura_principal, V3_separacion_armadura_principal, V4_diametro_armadura_reparticion, V5_separacion_armadura_reparticion]
    objetivos_activos: [O1_costo_total, O2_peso_propio]
    restricciones_activas: [R1_flexion_ELU, R2_cuantia_minima, R3_cuantia_maxima_ductilidad, R4_espesor_minimo_por_luz, R5_recubrimiento_minimo, R6_separacion_barras, R7_armadura_reparticion_minima, R9_deflexion_servicio]

  avanzado:
    descripcion: "Suma resistencia del hormigón como variable y huella de carbono como objetivo."
    variables_activas: [V1_espesor_losa, V2_diametro_armadura_principal, V3_separacion_armadura_principal, V4_diametro_armadura_reparticion, V5_separacion_armadura_reparticion, V6_resistencia_hormigon]
    objetivos_activos: [O1_costo_total, O2_peso_propio, O3_huella_carbono]
    restricciones_activas: [R1_flexion_ELU, R2_cuantia_minima, R3_cuantia_maxima_ductilidad, R4_espesor_minimo_por_luz, R5_recubrimiento_minimo, R6_separacion_barras, R7_armadura_reparticion_minima, R8_control_fisuracion, R9_deflexion_servicio]

  completo:
    descripcion: "Todo activo -- usar solo si el cronograma de la Fase 5 lo permite."
    variables_activas: [V1_espesor_losa, V2_diametro_armadura_principal, V3_separacion_armadura_principal, V4_diametro_armadura_reparticion, V5_separacion_armadura_reparticion, V6_resistencia_hormigon, V7_grado_acero, V8_numero_capas_armadura, V9_recubrimiento]
    objetivos_activos: [O1_costo_total, O2_peso_propio, O3_huella_carbono, O5_complejidad_constructiva] # O4 excluido: redundante con R9
    restricciones_activas: [R1_flexion_ELU, R2_cuantia_minima, R3_cuantia_maxima_ductilidad, R4_espesor_minimo_por_luz, R5_recubrimiento_minimo, R6_separacion_barras, R7_armadura_reparticion_minima, R8_control_fisuracion, R9_deflexion_servicio, R10_corte_ELU, R11_longitud_desarrollo]
